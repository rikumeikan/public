<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>public</title>
<style>
  :root { --bg:#f6f6f8; --fg:#16161a; --muted:#6b6b76; --card:#fff; --line:#e3e3ea; --accent:#0a66ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111114; --fg:#ececf1; --muted:#9a9aa6; --card:#1c1c21; --line:#2c2c33; --accent:#5b9bff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { padding:24px 16px 8px; max-width:1100px; margin:0 auto; }
  h1 { margin:0; font-size:20px; }
  #status { color:var(--muted); font-size:13px; margin-top:4px; }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 40px;
         display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  figure a.thumb { display:block; aspect-ratio:1; background:var(--line); }
  figure img { width:100%; height:100%; object-fit:cover; display:block; }
  figcaption { padding:8px 10px; font-size:12px; display:flex; gap:8px; align-items:center; }
  figcaption span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { font:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--accent);
           border-radius:6px; padding:2px 8px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>public</h1>
  <div id="status">読み込み中…</div>
</header>
<main id="grid"></main>
<script>
// リポジトリ直下の画像を一覧にする。ファイル一覧は GitHub の API から読む。
// 一覧を手で書かずに済むので、画像を上げるだけでここに並ぶ。
const OWNER = "rikumeikan", REPO = "public", BRANCH = "main";
const IMAGE = /\.(png|jpe?g|gif|webp|svg|heic|avif)$/i;
const status = document.getElementById("status");
const grid = document.getElementById("grid");

fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(files => {
    const images = files.filter(f => f.type === "file" && IMAGE.test(f.name))
                        .sort((a, b) => b.name.localeCompare(a.name));
    status.textContent = images.length ? `${images.length} 枚` : "まだ画像がありません";
    for (const f of images) {
      const raw = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodeURIComponent(f.name)}`;
      const fig = document.createElement("figure");
      fig.innerHTML = `<a class="thumb" href="${raw}" target="_blank" rel="noopener"><img loading="lazy" alt=""></a>
        <figcaption><span></span><button type="button">URL</button></figcaption>`;
      fig.querySelector("img").src = raw;
      fig.querySelector("img").alt = f.name;
      fig.querySelector("span").textContent = f.name;
      const btn = fig.querySelector("button");
      btn.onclick = () => navigator.clipboard.writeText(raw)
        .then(() => { btn.textContent = "コピー済み"; setTimeout(() => btn.textContent = "URL", 1500); });
      grid.appendChild(fig);
    }
  })
  .catch(e => { status.textContent = `一覧を読めませんでした（${e.message}）。少し待ってから再読み込みしてください。`; });
</script>
</body>
</html>
